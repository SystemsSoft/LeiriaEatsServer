# /etc/nginx/conf.d/leiria-eats.conf — api.leiriaeats.com -> uvicorn em 127.0.0.1:8080.
# Aplicado à mão no servidor (ver 00-limites.conf). As linhas "managed by Certbot" são do
# certbot: ao copiar este ficheiro por cima, manter os caminhos do certificado iguais.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    server_name api.leiriaeats.com;
    client_max_body_size 20m;

    # Limites por IP (zonas em 00-limites.conf). "burst" é a folga antes de responder 429;
    # "nodelay" entrega a folga de imediato em vez de a espaçar.
    location = /login            { limit_req zone=login  burst=5  nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location = /register         { limit_req zone=login  burst=5  nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location = /company          { limit_req zone=login  burst=5  nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location = /drivers/login    { limit_req zone=login  burst=5  nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location = /drivers/register { limit_req zone=login  burst=5  nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location /upload/            { limit_req zone=upload burst=5  nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location /chat/              { limit_req zone=ia     burst=20 nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location /search             { limit_req zone=ia     burst=20 nodelay; include /etc/nginx/snippets/koma-proxy.conf; }
    location /                   { limit_req zone=geral  burst=60 nodelay; include /etc/nginx/snippets/koma-proxy.conf; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.leiriaeats.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.leiriaeats.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.leiriaeats.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name api.leiriaeats.com;
    return 404; # managed by Certbot
}
