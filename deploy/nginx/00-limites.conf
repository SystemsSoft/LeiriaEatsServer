# /etc/nginx/conf.d/00-limites.conf — zonas de limite de pedidos por IP (contexto http).
# Aplicado à mão no servidor (não é gerido pelo deploy_komaai.sh):
#   scp deploy/nginx/*.conf ec2-user@51.48.131.137:/tmp/ && ssh ... 'sudo cp /tmp/00-limites.conf
#   /tmp/leiria-eats.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx'
#
# Revisão de segurança de 12/11/2026: sem limites, um script podia gastar a quota paga do
# Gemini (/chat/*), encher o bucket (/upload/*) ou adivinhar senhas (/login) sem travão.
# As zonas guardam o estado por IP; "rate" é a média permitida e "burst" (no site) a folga.

limit_req_zone $binary_remote_addr zone=geral:10m   rate=30r/s;   # polling das apps de gestão/estafeta
limit_req_zone $binary_remote_addr zone=ia:10m      rate=2r/s;    # chat, voz e TTS (chave paga)
limit_req_zone $binary_remote_addr zone=upload:10m  rate=1r/s;    # imagens para o bucket
limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;   # tentativas de senha
limit_req_status 429;
